<html>
    <head>
        <title>bai 1 html</title>
    </head>

    <body>
        Môn phát triển ứng dụng web+BTL
    <!-- 
        Để chú thích dùng 2 cách
        Cách 1:ctrl + k + c
        cách 2 ctrl / -->
        <p>Thẻ p là thẻ phân đoạn</p>
        <h1>Thẻ H1</h1>
        <h2>Thẻ H2</h2>
        <h3>Thẻ H3</h3>

        <p>Môn web<br> Nhóm 03</p>
            <!-- Thẻ div và span để phân chia đoạn -->
             <div> Đây là thẻ div</div>
             <span> Đây là thẻ span</span>
            <!-- Thẻ b: viêt chữ đậm
            Thẻ i: viết chữ nghiêng
            Thẻ u: Gạch chân -->
            <b> Thẻ b </b><br>
            <i>Thẻ i </i><br>
            <u> Thẻ u </u><br>
            <div>
                <font face ="verdana">Môn phát triển Ứng Dụng Web</font>
                <font color="blue">Nhóm 03</font>
                <font size="10">Tiết 1 2</font>
                <br>
                <font face="arial" color="green" size="15">Nguyễn Thị Dung</font>
                
            </div>
    </body>
</html>
