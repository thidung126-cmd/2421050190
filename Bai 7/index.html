<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemtrabaicu</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        
         p{
                color:blue;
            }
        #ten-khoa{
            color:yellow;
        }
        p.Nhom{
            color:red;
        }
        .Khoi1{
            background-color:green;
            
        }
        .Khoi2{
            background-color:yellow;
            /* 1 giá trị: cách đều xung quanh=giá trị đó */
            /* 2 gtri: thì giá thị đầu là trên dưới,giá trị 2 là phải trái */
            /* 4 giá trị :theo thứ tự trên phải dưới trái */
            margin:50px  200px 10px 100px;
            /* cách dùng tương tự margin */
            padding:50px;
        }
        .Khoi3{
            background-color:red;
        }
        .Khoi4{
            background-color:blue;
            display:flex;
        }
        .Khoi5{
            background-color:aquamarine;
            width: 50%;
        }
        .Khoi6{
            background-color:bisque;
            width:50%;
        }
        
    </style>
</head>
<body>
    <div>
        <h1 style="color:red">Truong dai hoc mo dia chat</h1> 
        <p class="Nhom">Nhóm 03</p>
        <p>Truong dại học mỏ địa chất</p>
    </div>
    <div id="ten-khoa">Khoa CNTT</div>
    <div class="Khoi1">Khối 1</div>
    <div class="Khoi2">Khối 2</div>
    <div class="Khoi3">Khối 3</div>
    <div class="Khoi4">
        <div class="Khoi5">Khối 5</div>
        <div class="Khoi6">Khối 6</div>
    </div>
</body>
</html>
